<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163f35">
  <meta name="description" content="AoF-Tabellen für vier Spieler: Buy-in, Position, Hand und vorherige Gegneraktionen.">
  <title>AoF · Tabellen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23163f35'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-size='36' font-weight='bold' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=882a5b0">
  <script src="strategy-data.js" defer></script>
  <script src="engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <h1 class="sr-only">AoF-Tabellen</h1>
    <div class="toolbar">
      <label class="buy-in-field" for="buy-in">Buy-in <select id="buy-in"></select></label>
      <span id="game-format" class="game-format" aria-live="polite"></span>
      <button id="new-hand" class="button-quiet" type="button">↻ Neue Hand</button>
    </div>
    <div class="workspace">
      <div class="inputs">
        <section class="panel" aria-labelledby="position-title">
          <div class="section-heading"><h2 id="position-title">Position</h2></div>
          <div id="positions" class="position-buttons" role="group" aria-label="Deine Position">
            <button type="button" data-position="BB" aria-label="BB – Big Blind" aria-pressed="false">BB</button>
            <button type="button" data-position="SB" aria-label="SB – Small Blind" aria-pressed="false">SB</button>
            <button type="button" data-position="BTN" aria-label="BTN – Button" aria-pressed="false">BTN</button>
            <button type="button" data-position="CO" aria-label="CO – Cutoff" aria-pressed="false">CO</button>
          </div>
        </section>
        <section class="panel" aria-labelledby="hand-title">
          <div class="section-heading"><h2 id="hand-title">Hand</h2><button id="clear-hand" class="text-button" type="button" aria-label="Karten löschen" disabled>Löschen</button></div>
          <div class="hand-display">
            <div class="cards" aria-label="Gewählte Karten"><span id="card-one" class="card empty">?</span><span id="card-two" class="card empty">?</span></div>
            <strong id="hand-label" class="hand-label" aria-live="polite">—</strong>
            <div class="suit-buttons" role="group" aria-label="Gleiche oder verschiedene Kartenfarbe">
              <button id="suited" type="button" data-suit="s" aria-pressed="false" aria-label="s – gleiche Kartenfarbe" disabled>s</button>
              <button id="offsuit" type="button" data-suit="o" aria-pressed="false" aria-label="o – verschiedene Kartenfarben" disabled>o</button>
            </div>
          </div>
          <div id="ranks" class="rank-buttons" role="group" aria-label="Kartenränge"></div>
        </section>
      </div>
      <div class="result-column">
        <section class="panel" aria-labelledby="opponents-title">
          <div class="section-heading"><h2 id="opponents-title">Vor dir</h2></div>
          <div id="opponents"></div>
        </section>
        <section id="result" class="result-panel" data-tone="empty" aria-label="Empfehlung" aria-live="polite" aria-atomic="true">
          <div class="result-heading"><span>EMPFEHLUNG</span><span id="result-marker" aria-hidden="true">· · ·</span></div>
          <p id="result-context" class="result-context"></p>
          <h2 id="result-title">Position wählen</h2>
          <p id="result-description" hidden></p>
          <div id="result-foot" class="result-foot"><span id="result-hand">—</span><span id="result-table"></span></div>
        </section>
      </div>
    </div>
    <noscript><p>Bitte JavaScript aktivieren.</p></noscript>
  </main>
</body>
</html>
